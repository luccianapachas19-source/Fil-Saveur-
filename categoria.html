
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colección | Fil & Saveur</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
  <a class="marca" href="index.html">Fil & Saveur</a>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="categoria.html?tipo=cocina">Cocina</a>
    <a href="categoria.html?tipo=costura">Costura</a>
    <a href="categoria.html?tipo=manualidades">Manualidades</a>
  </nav>
</header>

<main>
  <section class="centro">
    <p class="subtitulo">Colección artesanal</p>
    <h1 id="titulo"></h1>
    <p>Descubre nuestros regalos de esta colección.</p>
  </section>

  <div class="rejilla" id="productos"></div>
</main>

<footer>Fil & Saveur · The Luz en Loop</footer>

<script src="catalogo.js"></script>
<script>
const tipo = new URLSearchParams(location.search).get("tipo");

const categorias = {
  cocina: "Cocina",
  costura: "Costura",
  manualidades: "Manualidades"
};

document.getElementById("titulo").textContent =
  categorias[tipo] || "Colección no encontrada";

const contenedor = document.getElementById("productos");

productos
  .filter(p => p.categoria === tipo)
  .forEach(p => {
    const tarjeta = document.createElement("article");
    tarjeta.className = "tarjeta";

    tarjeta.innerHTML = `
      <img src="${p.imagen}" alt="${p.nombre}">
      <h3>${p.nombre}</h3>
      <p>${p.descripcion}</p>
      <p><strong>S/ ${p.precio.toFixed(2)}</strong></p>
      <a class="boton" href="producto.html?id=${p.id}">
        Ver producto
      </a>
    `;

    contenedor.appendChild(tarjeta);
  });
</script>
</body>
</html>
