
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo | Fil & Saveur</title>
<style>
body{font-family:system-ui,sans-serif;background:#FFF5E8;
color:#493128;margin:0}
header{background:#941F2B;color:white;padding:20px}
header a{color:white}
main{max-width:1050px;margin:auto;padding:24px}
h1,h2{color:#941F2B}
.grid{display:grid;grid-template-columns:
repeat(auto-fit,minmax(230px,1fr));gap:20px}
article{background:white;border-radius:16px;
overflow:hidden;box-shadow:0 5px 18px #49312822}
img{width:100%;height:200px;object-fit:cover}
.info{padding:18px}
.boton{display:inline-block;background:#28533B;
color:white;padding:12px 18px;border-radius:8px;
text-decoration:none;font-weight:bold}
a:focus-visible{outline:3px solid #1668a5}
</style>
</head>
<body>
<header>
  <a href="index.html">← Volver al inicio</a>
  <strong> · Fil &amp; Saveur</strong>
</header>
<main>
  <h1 id="titulo"></h1>
  <div id="lista" class="grid"></div>
</main>

<script src="catalogo.js"></script>
<script>
const tipo = new URLSearchParams(location.search).get("tipo");

const nombres = {
  cocina: "Cocina",
  costura: "Costura",
  manualidades: "Manualidades"
};

document.getElementById("titulo").textContent =
  "Productos de " + (nombres[tipo] || "Fil & Saveur");

const lista = document.getElementById("lista");

productos
  .filter(p => p.categoria === tipo)
  .forEach(p => {
    const card = document.createElement("article");

    card.innerHTML = `
      <img src="${p.imagen}" alt="${p.nombre}">
      <div class="info">
        <h2>${p.nombre}</h2>
        <p>S/ ${p.precio.toFixed(2)}</p>
        <a class="boton" href="producto.html?id=${p.id}">
          Ver producto
        </a>
      </div>
    `;

    lista.appendChild(card);
  });
</script>
</body>
</html>
