
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producto | Fil & Saveur</title>
<style>
body{font-family:system-ui,sans-serif;background:#FFF5E8;
color:#493128;margin:0}
header{background:#941F2B;color:white;padding:20px}
header a{color:white}
main{max-width:760px;margin:30px auto;padding:20px}
article{background:white;border-radius:18px;
padding:24px;box-shadow:0 5px 20px #49312822}
img{width:100%;max-height:380px;object-fit:cover;
border-radius:12px}
h1{color:#941F2B}
button,.boton{display:inline-block;background:#28533B;
color:white;border:0;border-radius:8px;padding:12px 18px;
font:inherit;font-weight:bold;text-decoration:none;cursor:pointer}
</style>
</head>
<body>
<header>
  <a href="index.html">Fil &amp; Saveur · Inicio</a>
</header>

<main id="contenido"></main>

<script src="catalogo.js"></script>
<script>
const id = Number(
  new URLSearchParams(location.search).get("id")
);

const p = productos.find(p => p.id === id);
const contenido = document.getElementById("contenido");

if (!p) {
  contenido.textContent = "Producto no encontrado.";
} else {
  contenido.innerHTML = `
    <article>
      <img src="${p.imagen}" alt="${p.nombre}">
      <h1>${p.nombre}</h1>
      <p>${p.descripcion}</p>
      <h2>S/ ${p.precio.toFixed(2)}</h2>

      <button id="agregar">Agregar al pedido</button>
      <p id="estado" role="status"></p>

      <a class="boton"
         href="categoria.html?tipo=${p.categoria}">
        Volver a la categoría
      </a>
    </article>
  `;

  document.getElementById("agregar").onclick = () => {
    agregarAlCarrito(p.id);
    document.getElementById("estado").textContent =
      "Producto agregado al pedido.";
  };
}
</script>
</body>
</html>
