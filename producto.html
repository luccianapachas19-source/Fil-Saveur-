
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producto | Fil & Saveur</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
  <a class="marca" href="index.html">Fil & Saveur</a>
  <nav><a href="index.html">Inicio</a></nav>
</header>

<main id="contenido"></main>

<footer>Fil & Saveur · The Luz en Loop</footer>

<script src="catalogo.js"></script>
<script>
const id = Number(
  new URLSearchParams(location.search).get("id")
);

const p = productos.find(producto => producto.id === id);
const contenido = document.getElementById("contenido");

if (p) {
  contenido.innerHTML = `
    <article class="ficha">
      <img src="${p.imagen}" alt="${p.nombre}">
      <div>
        <p class="subtitulo">Fil & Saveur</p>
        <h2>${p.nombre}</h2>
        <p>${p.descripcion}</p>
        <h3>S/ ${p.precio.toFixed(2)}</h3>
        <button class="boton" id="agregar">
          Agregar al carrito
        </button>
        <p id="mensaje" aria-live="polite"></p>
        <a href="categoria.html?tipo=${p.categoria}">
          Volver a la colección
        </a>
      </div>
    </article>
  `;

  document.getElementById("agregar").onclick = () => {
    agregarAlCarrito(p.id);
    document.getElementById("mensaje").textContent =
      "Producto agregado al carrito.";
  };
} else {
  contenido.innerHTML = `
    <h2>Producto no encontrado</h2>
    <a class="boton" href="index.html">Volver al inicio</a>
  `;
}
</script>
</body>
</html>
